<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>通话星空 · 单文件 demo</title>
<style>
  :root{--bg:#070a18;--ink:rgba(255,255,255,.9);--chip:rgba(255,255,255,.12)}
  :root[data-theme="day"]{--bg:#fdf3f6;--ink:#5a4a47;--chip:rgba(90,74,71,.08)}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,'PingFang SC',system-ui,sans-serif;overflow:hidden;touch-action:none}
  #sky{position:fixed;inset:0;width:100%;height:100%}
  .bar{position:fixed;left:0;right:0;bottom:max(16px,env(safe-area-inset-bottom));display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:0 16px}
  .bar button{border:0;border-radius:999px;padding:10px 14px;background:var(--chip);color:var(--ink);font-size:14px}
  .bar button.on{background:#da7756;color:#fff}
  .hint{position:fixed;top:max(14px,env(safe-area-inset-top));left:16px;right:16px;text-align:center;font-size:12.5px;opacity:.6}
</style>
</head>
<body>
<canvas id="sky"></canvas>
<div class="hint">点空白处聚拢 / 换形 · 手指划过推开星星 · 双指转动和缩放</div>
<div class="bar">
  <button id="me">我在说</button>
  <button id="him">AI 在说</button>
  <button id="theme">日 / 夜</button>
</div>
<script>
/* 通话星空：平时散开慢慢飘；你开口聚成当前形状，AI 开口换下一个；40 秒都安静就散回去。
   可以直接拷走。接进自己的通话页时，只需要在「开始 / 停止说话」时调 sky.voice('me'|'him', true|false)。 */
const sky = (function () {
  const cv = document.getElementById('sky'), c2 = cv.getContext('2d');
  let W = 0, H = 0, N = 0, parts = [], mode = '';
  let phase = 'free', shapeIdx = -1, phaseT = 0, tPrev = 0, raf = 0, frame = 0;
  let rotY = 0, rotX = 0, zoom = 1, amp = 0, clock = 0;
  let lastTouch = -1e9, lastVoice = -1e9;
  const SPIN = 0.0038, FR = 74;                       // 自转速度；手指推开的半径（px）
  const vo = { me: false, him: false, himOff: -1e9 };
  const fg = { on: false, x: 0, y: 0, vx: 0, vy: 0, sx: 0, sy: 0, st: 0, moved: 0 };
  const SHAPES = ['paw', 'planet', 'galaxy', 'dipper'];
  const NIGHT = ['#ffffff', '#cfdaff', '#ffd9a6', '#a9c9ff'];
  const DAY = ['#f4a8c4', '#f7bfd4', '#e8b6d6', '#f2cfa6'];
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const rnd = (a, b) => a + Math.random() * (b - a);
  const gauss = () => (Math.random() + Math.random() + Math.random() - 1.5) * 0.8;

  /* —— 四种形状：每种返回 n 个 [x,y,z]，坐标大致在 -1..1 —— */
  function genPaw(n) {                                // 猫爪：一个肉垫 + 四个脚趾，带一点厚度
    const toes = [[-0.52, -0.30], [-0.18, -0.50], [0.18, -0.50], [0.52, -0.30]], pts = [];
    for (let i = 0; i < n; i++) {
      let cx, cy, rx, ry;
      if (i < n * 0.55) { cx = 0; cy = 0.34; rx = 0.44; ry = 0.36 } else { const t = toes[i % 4]; cx = t[0]; cy = t[1]; rx = 0.17; ry = 0.20 }
      const a = Math.random() * 6.283, rr = Math.sqrt(Math.random()), dome = Math.sqrt(Math.max(0, 1 - rr * rr));
      pts.push([cx + Math.cos(a) * rx * rr, cy + Math.sin(a) * ry * rr, (Math.random() < 0.5 ? 1 : -1) * 0.09 * dome + gauss() * 0.02]);
    }
    return pts;
  }
  function genPlanet(n) {                             // 星球：斐波那契球面 + 一圈斜着的环
    const pts = [], ns = Math.floor(n * 0.58), ga = Math.PI * (3 - Math.sqrt(5));
    for (let i = 0; i < ns; i++) { const yy = 1 - 2 * (i + 0.5) / ns, rr = Math.sqrt(1 - yy * yy), th = ga * i; pts.push([Math.cos(th) * rr * 0.55, yy * 0.55, Math.sin(th) * rr * 0.55]) }
    const ct = Math.cos(0.5), st = Math.sin(0.5);
    for (let i = ns; i < n; i++) { const a = Math.random() * 6.283, r = rnd(0.72, 1.12), x = Math.cos(a) * r, z = Math.sin(a) * r, y = gauss() * 0.015; pts.push([x, y * ct - z * st, y * st + z * ct]) }
    return pts;
  }
  function genGalaxy(n) {                             // 星系：一个核 + 两条旋臂
    const pts = [], nb = Math.floor(n * 0.14);
    for (let i = 0; i < nb; i++) { const a = Math.random() * 6.283, b = Math.acos(rnd(-1, 1)), r = 0.16 * Math.cbrt(Math.random()); pts.push([r * Math.sin(b) * Math.cos(a), r * Math.sin(b) * Math.sin(a) * 0.6, r * Math.cos(b)]) }
    for (let i = nb; i < n; i++) { const arm = (i % 2) ? 0 : Math.PI, t = Math.pow(Math.random(), 0.75) * 7.54, r = 0.14 + 0.9 * Math.pow(t / 7.54, 1.05), th = t * 0.85 + arm + gauss() * 0.14; pts.push([Math.cos(th) * r, Math.sin(th) * r, gauss() * 0.05 * (1.1 - r * 0.6)]) }
    return pts;
  }
  function genDipper(n) {                             // 北斗：七颗星 + 连线 + 背景散星
    const S = 1.35, A = [[0.58, -0.30], [0.62, 0.02], [0.30, 0.06], [0.28, -0.24], [0.0, -0.18], [-0.30, -0.10], [-0.60, 0.06]].map(p => [p[0] * S, p[1] * S]);
    const L = [[0, 1], [1, 2], [2, 3], [3, 0], [3, 4], [4, 5], [5, 6]], pts = [], nA = Math.floor(n * 0.22), nL = Math.floor(n * 0.40);
    for (let i = 0; i < nA; i++) { const s = A[i % 7]; pts.push([s[0] + gauss() * 0.035, s[1] + gauss() * 0.035, gauss() * 0.03]) }
    for (let i = 0; i < nL; i++) { const sg = L[i % 7], a = A[sg[0]], b = A[sg[1]], t = Math.random(); pts.push([a[0] + (b[0] - a[0]) * t + gauss() * 0.012, a[1] + (b[1] - a[1]) * t + gauss() * 0.012, gauss() * 0.02]) }
    for (let i = nA + nL; i < n; i++) pts.push([rnd(-1.15, 1.15), rnd(-1.15, 1.15), rnd(-0.5, 0.5)]);
    return pts;
  }
  const GEN = { paw: genPaw, planet: genPlanet, galaxy: genGalaxy, dipper: genDipper }, cache = {};
  const targetsFor = name => cache[name + N] || (cache[name + N] = GEN[name](N));

  function applyShape(i) {
    shapeIdx = ((i % SHAPES.length) + SHAPES.length) % SHAPES.length;
    const T = targetsFor(SHAPES[shapeIdx]);
    parts.forEach((p, k) => { const t = T[k % T.length]; p.tx = t[0]; p.ty = t[1]; p.tz = t[2] });
  }
  function toFree() { for (const p of parts) { p.tx = rnd(-1.4, 1.4); p.ty = rnd(-1.4, 1.4); p.tz = rnd(-0.9, 0.9) } }
  const isDark = () => document.documentElement.dataset.theme !== 'day';
  function build() {                                  // 星星数量跟着屏幕面积走，最多 1000 颗
    mode = isDark() ? 'night' : 'day';
    N = Math.round(Math.min(1000, Math.max(360, W * H / (mode === 'night' ? 380 : 560))));
    parts = [];
    for (let i = 0; i < N; i++) parts.push({
      x: rnd(-1.4, 1.4), y: rnd(-1.4, 1.4), z: rnd(-0.9, 0.9), tx: 0, ty: 0, tz: 0, ox: 0, oy: 0,
      vx: rnd(-1, 1) * 0.0007, vy: -rnd(0.0006, 0.0022), vz: rnd(-1, 1) * 0.0004,
      tw: Math.random() * 6.283, ts: rnd(0.6, 1.8), sz: mode === 'night' ? rnd(0.6, 1.9) : rnd(0.9, 2.4),
      cl: (mode === 'night' ? NIGHT : DAY)[Math.floor(Math.random() * 4)], d: Math.random()
    });
    if (formed()) applyShape(shapeIdx);
  }
  const formed = () => phase === 'form' || phase === 'hold';
  function snap() { for (const p of parts) { p.x = p.tx; p.y = p.ty; p.z = p.tz } phase = 'hold'; phaseT = 0; draw() }
  function gather(next) {
    if (formed() && !next) return;
    applyShape((next || shapeIdx < 0) ? shapeIdx + 1 : shapeIdx);
    if (reduce) return snap();
    phase = 'form'; phaseT = 0;
  }

  /* —— 对外：谁开始 / 停止说话 —— */
  function voice(who, on) {
    const now = performance.now();
    if (who === 'him') {
      if (on && !vo.him && (!formed() || now - vo.himOff > 2500)) gather(true);   // AI 开口：换下一个形状
      if (!on && vo.him) vo.himOff = now;
      vo.him = on;
    } else {
      if (on && !vo.me && !formed()) gather(false);                              // 你开口：聚成当前形状
      vo.me = on;
    }
    lastVoice = now;
  }
  function tap() { lastTouch = performance.now(); gather(formed()) }

  function step(dt) {
    phaseT += dt; clock += dt;
    const now = performance.now(), touched = now - lastTouch < 25000;
    if (phase === 'form' && phaseT > 3.2) { phase = 'hold'; phaseT = 0 }
    else if (phase === 'hold' && !vo.me && !vo.him && now - lastVoice > 40000 && !touched) { toFree(); phase = 'melt'; phaseT = 0 }
    else if (phase === 'melt' && phaseT > 3) {
      phase = 'free'; phaseT = 0;
      for (const p of parts) { p.vx = rnd(-1, 1) * 0.0007; p.vy = -rnd(0.0006, 0.0022); p.vz = rnd(-1, 1) * 0.0004 }
    }
    const want = vo.him ? 1 : (vo.me ? 0.55 : 0);                                // 呼吸幅度：AI 说话比你大
    amp += (want - amp) * Math.min(1, dt * 2.5);
    if (!touched && formed()) rotY += SPIN * dt * 30 * (1 + amp * 0.6);
    for (const p of parts) {
      if (phase === 'free') {
        p.x += p.vx * dt * 60; p.y += p.vy * dt * 60; p.z += p.vz * dt * 60;
        if (p.y < -1.5) p.y = 1.5; if (p.x < -1.5) p.x = 1.5; if (p.x > 1.5) p.x = -1.5; if (p.z < -1) p.z = 1; if (p.z > 1) p.z = -1;
      } else {
        const k = phase === 'form' ? Math.max(0, Math.min(1, phaseT * 1.6 - p.d)) * 0.075 : 0.075;   // p.d 让星星错开出发
        p.x += (p.tx - p.x) * k; p.y += (p.ty - p.y) * k; p.z += (p.tz - p.z) * k;
      }
    }
    fg.vx *= 0.7; fg.vy *= 0.7;
  }
  function star4(x, y, r) { c2.beginPath(); c2.moveTo(x, y - r); c2.quadraticCurveTo(x, y, x + r, y); c2.quadraticCurveTo(x, y, x, y + r); c2.quadraticCurveTo(x, y, x - r, y); c2.quadraticCurveTo(x, y, x, y - r); c2.fill() }
  function draw() {
    c2.clearRect(0, 0, W, H);
    const cy = Math.cos(rotY), sy = Math.sin(rotY), cx = Math.cos(rotX), sx = Math.sin(rotX);
    const breathe = 1 + amp * (0.03 + 0.04 * Math.sin(clock * (vo.him ? 6.5 : 4.5)));
    const S = Math.min(W, H) * 0.34 * zoom * breathe, CX = W / 2, CY = H * 0.46, F = 3.1, night = mode === 'night';
    const R2 = FR * FR, tws = 0.02 * (1 + amp * 1.2);
    for (const p of parts) {
      const X = p.x * cy + p.z * sy, Z0 = p.z * cy - p.x * sy, Y2 = p.y * cx - Z0 * sx, Z2 = p.y * sx + Z0 * cx;
      const pr = F / (F + Z2); if (pr <= 0) continue;                         // 透视：近大远小
      let px = CX + X * S * pr, py = CY + Y2 * S * pr;
      if (fg.on) {                                                             // 手指附近的星星被推开
        const dx = px + p.ox - fg.x, dy = py + p.oy - fg.y, d2 = dx * dx + dy * dy;
        if (d2 < R2) { const d = Math.sqrt(d2) || 1, f = 1 - d / FR; p.ox += dx / d * f * f * 15 + fg.vx * f * 0.35; p.oy += dy / d * f * f * 15 + fg.vy * f * 0.35 }
      }
      if (p.ox || p.oy) { p.ox *= 0.9; p.oy *= 0.9; if (Math.abs(p.ox) < 0.05) p.ox = 0; if (Math.abs(p.oy) < 0.05) p.oy = 0 }   // 松手慢慢弹回
      px += p.ox; py += p.oy;
      if (px < -8 || px > W + 8 || py < -8 || py > H + 8) continue;
      c2.globalAlpha = (0.35 + 0.65 * Math.abs(Math.sin(p.tw += tws * p.ts))) * Math.max(0.15, Math.min(1, pr * pr * 0.9));
      c2.fillStyle = p.cl;
      const sz = p.sz * pr;
      if (!night && sz > 2.0) star4(px, py, sz * 1.9);
      else if (sz < 1.4) { const q = Math.max(0.8, sz); c2.fillRect(px, py, q, q) }
      else { c2.beginPath(); c2.arc(px, py, sz * 0.62, 0, 6.283); c2.fill() }
    }
    c2.globalAlpha = 1;
  }
  function tick(ts) {
    raf = 0;
    frame++; if (frame & 1) { raf = requestAnimationFrame(tick); return }       // 隔一帧画一次，约 30fps，省电
    const dt = Math.min(0.1, ((ts - tPrev) / 1000) || 0.033); tPrev = ts;
    step(dt); draw(); raf = requestAnimationFrame(tick);
  }
  function resize() {
    const d = Math.min(2, devicePixelRatio || 1);                              // DPR 封顶 2
    W = cv.clientWidth || innerWidth; H = cv.clientHeight || innerHeight;
    cv.width = Math.round(W * d); cv.height = Math.round(H * d); c2.setTransform(d, 0, 0, d, 0, 0);
  }

  /* —— 手势：单指点 = 聚拢 / 换形；单指划 = 推开；双指 = 转动 + 缩放 —— */
  const g = { pt: null, d0: 0, rY: 0, rX: 0, z0: 1, multi: false };
  function fDown(x, y) { const now = performance.now(); Object.assign(fg, { on: true, x, y, sx: x, sy: y, vx: 0, vy: 0, st: now, moved: 0 }); lastTouch = now }
  function fMove(x, y) { if (!fg.on) return; fg.vx = x - fg.x; fg.vy = y - fg.y; fg.x = x; fg.y = y; fg.moved = Math.max(fg.moved, Math.hypot(x - fg.sx, y - fg.sy)); lastTouch = performance.now() }
  function fUp() { if (!fg.on) return; fg.on = false; if (!g.multi && fg.moved < 12 && performance.now() - fg.st < 320) tap() }
  cv.addEventListener('touchstart', e => {
    if (e.touches.length >= 2) {
      g.multi = true; fg.on = false; const a = e.touches[0], b = e.touches[1];
      g.pt = { x: (a.clientX + b.clientX) / 2, y: (a.clientY + b.clientY) / 2 }; g.d0 = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
      g.rY = rotY; g.rX = rotX; g.z0 = zoom; lastTouch = performance.now();
    } else { g.multi = false; fDown(e.touches[0].clientX, e.touches[0].clientY) }
    e.preventDefault();
  }, { passive: false });
  cv.addEventListener('touchmove', e => {
    if (e.touches.length >= 2 && g.pt) {
      const a = e.touches[0], b = e.touches[1], mx = (a.clientX + b.clientX) / 2, my = (a.clientY + b.clientY) / 2;
      rotY = g.rY + (mx - g.pt.x) * 0.006; rotX = Math.max(-1.3, Math.min(1.3, g.rX + (my - g.pt.y) * 0.006));
      zoom = Math.max(0.55, Math.min(2.4, g.z0 * (Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY) / (g.d0 || 1))));
      lastTouch = performance.now();
    } else if (e.touches.length === 1) fMove(e.touches[0].clientX, e.touches[0].clientY);
    e.preventDefault();
  }, { passive: false });
  cv.addEventListener('touchend', e => { if (e.touches.length < 2) g.pt = null; if (!e.touches.length) fUp() });
  cv.addEventListener('mousedown', e => { g.multi = false; fDown(e.clientX, e.clientY) });
  addEventListener('mousemove', e => fMove(e.clientX, e.clientY));
  addEventListener('mouseup', fUp);

  function start() { resize(); build(); tPrev = performance.now(); if (reduce) { applyShape(1); snap(); return } raf = requestAnimationFrame(tick) }
  function stop() { cancelAnimationFrame(raf); raf = 0 }
  addEventListener('resize', () => { resize(); build() });
  document.addEventListener('visibilitychange', () => { if (document.hidden) stop(); else if (!raf && !reduce) { tPrev = performance.now(); raf = requestAnimationFrame(tick) } });   // 看不见就别画
  return { start, stop, voice, tap, rebuild: build, form(i) { applyShape(i); lastTouch = performance.now(); snap() } };
})();

sky.start();
/* —— 下面只是 demo 的按钮，接进真实通话页时换成你的「开始 / 停止说话」回调 —— */
for (const who of ['me', 'him']) {
  const b = document.getElementById(who);
  b.onclick = () => { const on = !b.classList.contains('on'); b.classList.toggle('on', on); sky.voice(who, on) };
}
document.getElementById('theme').onclick = () => {
  const r = document.documentElement; r.dataset.theme = r.dataset.theme === 'day' ? '' : 'day'; sky.rebuild();
};
</script>
</body>
</html>
